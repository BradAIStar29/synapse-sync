name = "synapse-sync-api"
main = "index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# BMAI Asset Consultant (Cloudflare Agents SDK) — stateful DO per visitor session
[durable_objects]
bindings = [{ name = "BmaiConsultantAgent", class_name = "BmaiConsultantAgent" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BmaiConsultantAgent"]

[vars]
APP_URL = "https://bmai-synapse-sync.pages.dev"

# Cloudflare Workers AI binding — enables real AI content generation
[ai]
binding = "AI"

# Secrets (set via: wrangler secret put STRIPE_SECRET_KEY)
# STRIPE_SECRET_KEY
# VITE_STRIPE_PUBLISHABLE_KEY
# CAPTIVATION_HUB_API_KEY
